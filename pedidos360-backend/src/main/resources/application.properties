spring.application.name=pedidos360-backend
server.port=8888

# On EC2 use an absolute DB_URL and back up the data directory.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/pedidos360}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
app.cognito.issuer=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_cRb1mCRID}
app.cognito.client-id=${COGNITO_CLIENT_ID:72tfeld99bp84ph6k5qth991d8}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:4200}
spring.jackson.deserialization.accept-float-as-int=false
